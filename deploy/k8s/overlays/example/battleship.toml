# battleship config for the example overlay: the values that differ from
# battleship's built-in defaults (which match the current competition setup),
# plus defaults this deployment depends on (the shutdown timeouts and the
# issuer), stated so a change to the defaults can't move them. See
# ../../base/battleship.toml for every key with comments.

[proxmox]
url = "https://proxmox.example.invalid:8006" # CHANGE ME
# Or fail over between nodes: replace url with urls (not both). "battleship
# nodes" prints this line; allow every listed IP in networkpolicy.yaml.
# urls = ["https://192.0.2.121:8006", "https://192.0.2.123:8006", "https://192.0.2.125:8006"]
# The cluster CA from the ConfigMap (see kustomization.yaml and the base's note).
ca_file = "/config/pve-root-ca.pem"

# Clone, config-call and build limits are per replica (2 replicas double
# them); workers is per job; deletes is shared by every process, capped at
# the largest value any of them has.
[concurrency]
workers = 10
clones_per_node = 5
config_calls = 3
template_builds = 2
deletes = 2                            # avoids Proxmox user.cfg lock timeouts

[teardown]
shutdown_timeout = "60s"

[web]
base_url = "https://battleship.example.org"  # must match the Ingress host
trusted_proxies = ["10.42.0.0/16"]     # CHANGE ME: ingress controller pod CIDR
shutdown_timeout = "15m"               # < terminationGracePeriodSeconds (960s)
# templates = "*.kilo.alpha"          # this competition's template set: its hosts are grid columns, missing for a team without them

[oidc]
issuer = "https://auth.example.org/application/o/battleship/"
client_id = "battleship"

# No [roles]: who may open battleship is decided in Authentik (the
# application's policy bindings exclude students), what each user may do by
# Proxmox.
