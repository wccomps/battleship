apiVersion: apps/v1
kind: Deployment
metadata:
  name: battleship
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: battleship
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # New replica up before an old one starts its (up to 16m) shutdown,
      # so capacity never drops below 2 during a release.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: battleship
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: battleship
      automountServiceAccountToken: false
      enableServiceLinks: false

      # stopped job's worst case (14m) < web.shutdown_timeout (15m) < this (16m).
      # Shorter SIGKILLs replicas mid-cleanup, leaving half-built VMs.
      # Raise it whenever you raise web.shutdown_timeout.
      terminationGracePeriodSeconds: 960

      securityContext:
        runAsNonRoot: true
        # distroless "nonroot" user.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Spread replicas over Proxmox hosts; label each node, e.g.
            #   kubectl label node k8s-worker-1 topology.example.org/proxmox-host=alder
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.example.org/proxmox-host
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: battleship
                    app.kubernetes.io/component: web
            # Fallback: at least different Kubernetes nodes.
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: battleship
                    app.kubernetes.io/component: web

      containers:
        - name: battleship
          image: ghcr.io/wccomps/battleship # tag pinned by the overlay (images:)
          imagePullPolicy: IfNotPresent
          # WORKDIR is /config, so ./battleship.toml is the ConfigMap's file.
          args: ["serve", "-log-format", "json"]
          ports:
            - name: http
              containerPort: 8080 # web.listen
              protocol: TCP
          env:
            # No Proxmox token: battleship acts as each signed-in person.
            # The seal key encrypts the Proxmox credentials jobs keep.
            - name: BATTLESHIP_SEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: battleship-secrets
                  key: seal-key
            - name: BATTLESHIP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: battleship-secrets
                  key: oidc-client-secret
            # Written by CNPG for Cluster "battleship-db". With another operator,
            # point this at its secret or a "database-url" key in battleship-secrets.
            - name: BATTLESHIP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: battleship-db-app
                  key: uri
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp

          # Migrations and up to 30s of Authentik retries run BEFORE the
          # listener opens; allow 2 minutes.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          # 503 when Postgres is down or during shutdown. Never calls Proxmox,
          # by design (see README "Kubernetes").
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          # Process responsiveness only. Not probed while terminating, so the
          # server closing while jobs stop is safe.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          resources:
            # Mostly I/O-bound; revisit with real numbers.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

      volumes:
        - name: config
          configMap:
            name: battleship-config # generated by kustomization.yaml (hash-suffixed)
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
