name: Security

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Advisories arrive without a push.
  vulncheck:
    uses: ./.github/workflows/vulncheck.yml

  targets:
    name: List fuzz targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: List
        id: list
        shell: bash
        run: |
          matrix="$(go test -list '^Fuzz' -json ./... | jq -cs '[.[] | select(.Action == "output" and (.Output | startswith("Fuzz"))) | {pkg: .Package, target: (.Output | rtrimstr("\n"))}]')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz
        id: fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: |
          echo "dir=$(go list -f '{{.Dir}}' "$PKG")" >> "$GITHUB_OUTPUT"
          go test "$PKG" -run '^$' -fuzz "^$TARGET\$" -fuzztime 5m

      # Commit the input under testdata/fuzz/<target>/ so go test replays it.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ steps.fuzz.outputs.dir }}/testdata/fuzz/
