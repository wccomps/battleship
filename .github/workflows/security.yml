name: Security

# Weekly: new advisories arrive without a push, and fuzzing needs longer
# than a PR run allows. go test already runs every fuzz seed on each push.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: auth, target: FuzzSafeNext }
          - { pkg: seal, target: FuzzOpen }
          - { pkg: config, target: FuzzParseSSHPublicKey }
          - { pkg: pods, target: FuzzGuestCommand }
          - { pkg: pods, target: FuzzParseHostSpec }
          - { pkg: pods, target: FuzzParseTeams }
          - { pkg: pods, target: FuzzUserNotes }
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test "./internal/$PKG" -run '^$' -fuzz "^$TARGET\$" -fuzztime 5m

      # A failing input lands in testdata/fuzz/<target>/; commit it there and
      # go test replays it on every run.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: internal/${{ matrix.pkg }}/testdata/fuzz/
