# EXAMPLE ONLY: not in kustomization.yaml; never commit real values. Create it out of band:
#
#   kubectl -n battleship create secret generic battleship-secrets \
#     --from-literal=seal-key="$(openssl rand -base64 48)" \
#     --from-literal=oidc-client-secret='<Authentik provider client secret>'
#
# or encrypt it for GitOps (SOPS, Sealed Secrets, External Secrets Operator).
#
# BATTLESHIP_DATABASE_URL comes from the Postgres operator's secret
# (CNPG: battleship-db-app, key "uri"), not here.
#
# Rotating oidc-client-secret logs everyone out at their next refresh (cookie
# and token keys derive from it). A process whose seal-key differs from the
# database's first one refuses to start (see the deploy README).
#
# There is no Proxmox token: battleship acts as each signed-in person.
apiVersion: v1
kind: Secret
metadata:
  name: battleship-secrets
  namespace: battleship
type: Opaque
stringData:
  seal-key: "PLACEHOLDER-NOT-A-REAL-SECRET-32-CHARS-MIN"  # BATTLESHIP_SEAL_KEY
  oidc-client-secret: "PLACEHOLDER-NOT-A-REAL-SECRET"     # BATTLESHIP_OIDC_CLIENT_SECRET
