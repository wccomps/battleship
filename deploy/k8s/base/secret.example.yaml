# EXAMPLE ONLY. NOT part of kustomization.yaml resources, and must never be
# committed with real values. Create the real Secret out of band, e.g.:
#
#   kubectl -n battleship create secret generic battleship-secrets \
#     --from-literal=seal-key="$(openssl rand -base64 48)" \
#     --from-literal=oidc-client-secret='<Authentik provider client secret>'
#
# or encrypt it for GitOps (SOPS, Sealed Secrets, External Secrets Operator).
#
# BATTLESHIP_DATABASE_URL does NOT come from here: it is read from the Postgres
# operator's secret (CloudNativePG: battleship-db-app, key "uri").
#
# Rotating oidc-client-secret logs every user out at their next session
# refresh (battleship derives its cookie, refresh-token and session-ticket
# keys from it). A process with a seal-key other than the one the database
# was first used with refuses to start (see the deploy README).
#
# There is no Proxmox token: battleship acts as each signed-in person.
apiVersion: v1
kind: Secret
metadata:
  name: battleship-secrets
  namespace: battleship
type: Opaque
stringData:
  seal-key: "PLACEHOLDER-NOT-A-REAL-SECRET-32-CHARS-MIN"  # BATTLESHIP_SEAL_KEY
  oidc-client-secret: "PLACEHOLDER-NOT-A-REAL-SECRET"     # BATTLESHIP_OIDC_CLIENT_SECRET
