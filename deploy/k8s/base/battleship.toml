# battleship production configuration (non-secret values only), mounted at
# /config/battleship.toml. Unknown keys fail startup. Full reference: battleship.example.toml.
#
# Secrets come from the environment (see deployment.yaml), never this file:
#   BATTLESHIP_OIDC_CLIENT_SECRET    oidc.client_secret
#   BATTLESHIP_SEAL_KEY              database.seal_key
#   BATTLESHIP_DATABASE_URL          database.url
#
# CHANGE ME values are placeholders; overlays replace this whole file.
# Patterns use {team} (two digits, e.g. 07) and {host} (e.g. teak).

[proxmox]
# CHANGE ME: a Proxmox node reachable from the cluster (allow TCP 8006 in
# networkpolicy.yaml), by a name its certificate holds; a VIP fails
# verification unless every node's certificate covers it.
url = "https://proxmox.example.invalid:8006"
# Better: list several nodes instead (not both) to fail over between them.
# "battleship nodes" prints the line.
# urls = ["https://pve1.example.invalid:8006", "https://pve2.example.invalid:8006"]
# No token: battleship acts as each signed-in person via their Proxmox OpenID
# ticket, so Proxmox's roles decide what they may do.
# The cluster CA comes from the overlay's ConfigMap; without it battleship
# refuses to start. Don't also set insecure_skip_verify.
ca_file = "/config/pve-root-ca.pem"

[naming]
vm_name = "team{team}-{host}"
pool = "pool-{team}"
clone_vmid_base = 10000            # clone VMID = base + team*stride + template_vmid%100
clone_vmid_team_stride = 100
template_vmid_base = 9000          # template VMID = base + master_vmid%100 (9000-9099)
template_suffix = ".tpl"

[network]
ext_bridge = "ext{team}"           # vnets in proxmox.sdn_zone; whoever deploys needs SDN.Use on them
int_bridge = "int{team}"
ext_subnet = "10.50.1{team}"      # cloud-init VMs get .2/30 with gateway .1
cicustom = "vendor=competitions:snippets/ssh-keys.yaml"

[deploy]
storage = "competitions"           # clone storage; whoever deploys needs Datastore.AllocateSpace on it
linked = true
master_tag = "dev"
disk_mbps_rd = 300
disk_mbps_wr = 300
snapshot_name = "initial"          # the baseline a deploy takes
baseline_patterns = ["fresh_clone_*"]  # old-tool baselines; reset uses the newest if no snapshot_name
gpu_vga = "virtio-gl"

# clones_per_node, config_calls and template_builds are PER REPLICA, so roughly
# half the single-process defaults. deletes is shared through the database by
# every process: give them all the same value.
[concurrency]
workers = 10                       # VMs processed at once, per job
clones_per_node = 5                # clone tasks at once per source node, per replica
config_calls = 3                   # executor and drift-scan API calls at once, per replica
template_builds = 2                # templates built at once, per replica
deletes = 2                        # VM deletes at once, across all replicas; more time out on Proxmox's user.cfg lock

[teardown]
shutdown_timeout = "60s"           # clean shutdown (routers release DHCP leases), then Proxmox hard-stops

[retry]
transient_patterns = ["file exists", "does not exist", "got no worker upid", "can't lock file", "is locked", "timeout"]
attempts = 7
initial_backoff = "1s"
max_backoff = "30s"
rounds = 1                         # end-of-job retry rounds for failed VMs
round_pause = "2s"
task_poll = "2s"

[database]
# url comes from BATTLESHIP_DATABASE_URL (the Postgres operator's secret).
# Main pool per replica; each replica uses up to max_conns + 4 = 20. Budget
# (replicas + 1 surging) x 20 = 60, plus workers and CLI runs, under Postgres's
# max_connections. See deploy/README.md section 4.
max_conns = 16

[jobs]
heartbeat = "10s"
stale_after = "60s"                # >= 5 x heartbeat; a silent job is marked interrupted
poll = "2s"

[web]
# CHANGE ME: must match the Ingress host and the Authentik redirect URI
# (<base_url>/auth/callback). https => __Host- Secure cookies.
base_url = "https://battleship.example.invalid"
listen = ":8080"                   # containerPort in deployment.yaml
workers = 2                        # job workers per replica
# Deploy pattern whose hosts are grid columns even before a team has them.
# Unset: only hosts teams have VMs of.
# templates = "*.kilo.alpha"
session_idle = "90m"                # longer than proxmox.ticket_renew_after
session_max = "12h"                # Authentik refresh token validity must be >= this
session_refresh = "5m"             # group changes take effect within this (3x while Authentik is unreachable)
status_poll = "5s"
drift_scan = "2m"
# Keep: a stopped job's worst case (14m) < this < terminationGracePeriodSeconds (960s).
shutdown_timeout = "15m"
# CHANGE ME: the ingress controller pods' CIDR (usually the pod CIDR); only
# these are believed for X-Forwarded-For / -Proto.
trusted_proxies = ["10.42.0.0/16"]

[oidc]
issuer = "https://auth.example.org/application/o/battleship/"
client_id = "battleship"            # the Authentik provider's client ID
scopes = ["openid", "profile", "email", "groups", "offline_access"]
groups_claim = "groups"

# No [roles]: Authentik policy bindings (which exclude students) decide who may
# open battleship, Proxmox what each user may do.
