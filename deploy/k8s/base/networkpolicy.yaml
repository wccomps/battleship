# Default-deny for the battleship pods (not the CNPG instances), then only what they need.
#
# Every CIDR below is a PLACEHOLDER: replace them, or battleship can't reach
# Authentik and fails to start.
#
# Most CNIs allow kubelet probes from the node regardless; if yours doesn't,
# allow the node CIDR on port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: battleship
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: battleship
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller. CHANGE ME if its namespace isn't "ingress-nginx".
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Cluster DNS (CoreDNS / kube-dns in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres: the CloudNativePG instances of Cluster "battleship-db" in this
    # namespace. CHANGE the selector if you use another operator.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: battleship-db
      ports:
        - protocol: TCP
          port: 5432
    # Proxmox API. CHANGE ME: every address in proxmox.url / proxmox.urls.
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 8006
    # Authentik (OIDC discovery, JWKS, token refresh). CHANGE ME: its address
    # as resolved FROM INSIDE the cluster. If it sits behind the same ingress,
    # traffic may hairpin via the LoadBalancer IP: allow that, or ingress-nginx on 443.
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - protocol: TCP
          port: 443
