# Example production overlay: copy it (e.g. to overlays/prod) and point Argo CD / Flux at it.
#
# Release by bumping newTag below (CI pushes :<vX.Y.Z> per git tag, :sha-<short>
# per main commit); roll back by reverting that commit. Never deploy :latest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Remove if the database comes from a different operator (see the file).
  - ../../postgres

images:
  - name: ghcr.io/wccomps/battleship
    newTag: v0.1.0 # CHANGE ME on each release (or pin a digest: "digest: sha256:...")

# Replace the base's placeholder config; unset keys take battleship's built-in defaults.
configMapGenerator:
  - name: battleship-config
    behavior: replace
    files:
      - battleship.toml
      # Proxmox cluster root CA, copied from a node (see deploy/README.md).
      # Gitignored here so `kustomize build` fails until it is provided.
      - pve-root-ca.pem

patches:
  # Public hostname (Ingress rule + TLS); must match web.base_url and the Authentik redirect URI.
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: battleship
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: battleship.example.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: battleship.example.org
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod # CHANGE ME: the cluster's ClusterIssuer
