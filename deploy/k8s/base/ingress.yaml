# Written for ingress-nginx. Other controllers need the equivalent: buffering
# off and long read timeouts for SSE.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: battleship
  annotations:
    # SSE: don't buffer. battleship also sends "X-Accel-Buffering: no".
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # SSE heartbeats every 15s; the hour is for previews, which make several
    # sequential Proxmox requests (up to 60s each) with no overall deadline.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Forms are small; nothing is uploaded.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager. CHANGE ME: the ClusterIssuer, or delete and supply the TLS secret.
    cert-manager.io/cluster-issuer: CHANGE-ME-cluster-issuer
spec:
  ingressClassName: nginx # CHANGE ME if the cluster's class differs
  tls:
    - hosts:
        - battleship.example.invalid # CHANGE ME (overlay patches this)
      secretName: battleship-tls
  rules:
    - host: battleship.example.invalid # CHANGE ME (overlay patches this); must match web.base_url
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: battleship
                port:
                  name: http
