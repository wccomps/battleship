# battleship configuration. Everything but [proxmox] (and, for serve, web.base_url
# and the [oidc] client) has a default; uncomment to change it.
# Patterns use {team} (two digits, e.g. 07) and {host} (e.g. teak).

[proxmox]
url = "https://192.0.2.123:8006"
# Or list several nodes to fail over between (not both); "battleship nodes" prints this line:
# urls = ["https://192.0.2.121:8006", "https://192.0.2.122:8006", "https://192.0.2.123:8006"]
# battleship holds no Proxmox token: every call uses the caller's own ticket or
# API token, so Proxmox's ACLs decide what each person may do.
# realm = "auth.example.org"     # the Proxmox OpenID realm people sign in to Proxmox through
# ticket_renew_after = "60m"     # renew a ticket (a session's or a job's) once it is this old; tickets last 2h
# ticket_max_age = "12h"         # sign in to Proxmox again after this; renewal never re-reads Authentik groups
# sdn_zone = "teams"             # the SDN zone of the team bridges; a deploy needs SDN.Use on their vnets
# The CLI uses your own API token: BATTLESHIP_PROXMOX_TOKEN_ID and _SECRET in the environment.
# serve and worker need exactly one of: ca_file, the cluster CA (any node's
# /etc/pve/pve-root-ca.pem), or insecure_skip_verify = true (logs a warning).
# ca_file = "/config/pve-root-ca.pem"
# insecure_skip_verify = false

# [naming]
# vm_name = "team{team}-{host}"
# pool = "pool-{team}"
# clone_vmid_base = 10000        # clone VMID = base + team*stride + template_vmid%100
# clone_vmid_team_stride = 100
# template_vmid_base = 9000      # template VMID = base + master_vmid%100
# template_suffix = ".tpl"

# [network]
# ext_bridge = "ext{team}"
# int_bridge = "int{team}"
# ext_subnet = "10.50.1{team}"  # cloud-init VMs get .2/30 with gateway .1
# cicustom = "vendor=competitions:snippets/ssh-keys.yaml"

# [deploy]
# storage = "competitions"
# linked = true
# master_tag = "dev"
# disk_mbps_rd = 300
# disk_mbps_wr = 300
# snapshot_name = "initial"          # the baseline a deploy takes
# Snapshots that count as a baseline when a VM has no snapshot_name; a reset
# naming no snapshot uses snapshot_name, else the newest match. [] for none.
# baseline_patterns = ["fresh_clone_*"]
# gpu_vga = "virtio-gl"

# clones_per_node, config_calls and template_builds are per process; workers is
# per job. With a database, deletes is shared by all processes: keep it the same everywhere.
# [concurrency]
# workers = 20                   # VMs processed at once, per job
# clones_per_node = 10           # clone tasks at once per source node
# config_calls = 5               # Proxmox API calls at once, task-starting POSTs included
# template_builds = 4            # templates built at once; each copy also takes a clone slot
# deletes = 4                    # VM deletes at once; more time out on Proxmox's user.cfg lock and leave VMs half-deleted

# Teardown shuts VMs down cleanly first so routers release their DHCP lease.
# [teardown]
# shutdown_timeout = "60s"       # then Proxmox hard-stops the VM

# [retry]
# transient_patterns = ["file exists", "does not exist", "got no worker upid", "can't lock file", "is locked", "timeout"]
# attempts = 6
# initial_backoff = "1s"
# max_backoff = "30s"
# rounds = 1
# round_pause = "2s"
# task_poll = "2s"

# Needed by the worker, web app and -queue. When set, direct CLI runs also run
# as jobs, so they wait for overlapping jobs.
# [database]
# url = ""                       # prefer the BATTLESHIP_DATABASE_URL environment variable
# max_conns = 16                 # main pool size per process (at least 4); +2 more for heartbeats and readiness, +1 for delete and storage slots, +1 to listen for job changes
# seal_key = ""                  # prefer BATTLESHIP_SEAL_KEY: 32+ random chars, same in every process; encrypts jobs' Proxmox credentials

# [jobs]
# heartbeat = "10s"              # how often a running job proves it's alive
# stale_after = "60s"            # a running job silent this long is marked interrupted (>= 5 x heartbeat)
# poll = "2s"                    # how often an idle worker looks for jobs
# cancel_grace = "30s"           # after a cancel, how long a step waits on a Proxmox task it started (0s-5m)

# battleship serve: the volunteer web app. It runs job workers too, so battleship worker is optional.
[web]
base_url = "https://battleship.example.org"  # the public URL; required for battleship serve
# listen = ":8080"
# workers = 2                    # job workers per replica
# templates = "*.kilo.alpha"    # deploy pattern whose hosts are the grid columns; empty (default): only hosts with team VMs
# session_idle = "90m"           # log out after this long without a request; must exceed proxmox.ticket_renew_after
# session_max = "12h"            # log out this long after login regardless
# session_refresh = "5m"         # how often a session re-checks the user's groups with Authentik
# status_poll = "5s"             # how often each viewer's grid reads the cluster, with their ticket, while open
# drift_scan = "2m"              # how often every team VM's config and snapshots are fully checked
# shutdown_timeout = "15m"       # on SIGTERM, time for running jobs to end; keep above 14m and below terminationGracePeriodSeconds
# trusted_proxies = []           # CIDRs of reverse proxies whose X-Forwarded-* headers are believed, e.g. ["10.42.0.0/16"]

# Login through Authentik (OIDC). Redirect URI: <web.base_url>/auth/callback.
[oidc]
client_id = "battleship"             # or the BATTLESHIP_OIDC_CLIENT_ID environment variable
# client_secret = ""            # prefer the BATTLESHIP_OIDC_CLIENT_SECRET environment variable; changing it logs everyone out at their next refresh
# issuer = "https://auth.example.org/application/o/battleship/"
# scopes = ["openid", "profile", "email", "groups", "offline_access"]  # battleship serve needs openid and offline_access
# groups_claim = "groups"

# No roles: Authentik policy bindings decide who may open it, Proxmox ACLs what
# each person may do. See the README.
