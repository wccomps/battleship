# Keeps one replica serving during node drains; each evicted replica still gets
# its full terminationGracePeriodSeconds (16m) for running jobs.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: battleship
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: battleship
      app.kubernetes.io/component: web
